services:
  db:
    image: postgres:17-alpine
    container_name: petzin_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: petzin_db
      POSTGRES_USER: petzin_user
      POSTGRES_PASSWORD: petzin_dev_123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petzin_user -d petzin_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: